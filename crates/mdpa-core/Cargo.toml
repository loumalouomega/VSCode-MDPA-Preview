[package]
name = "mdpa-core"
version = "0.1.0"
edition = "2021"
description = "Rust/WASM MDPA parser, summary scanner, and writer for VSCode-MDPA-Preview"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fast-float2 = "0.2"
itoa = "1"
js-sys = "0.3"
ryu = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
