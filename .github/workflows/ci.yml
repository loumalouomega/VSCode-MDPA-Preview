name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test-matrix:
    # windows-latest catches win32-only regressions. What that leg actually
    # covers is worth stating, because the comment here once justified it by
    # pointing at the very `t.skip("...win32")` guards that stopped it running:
    #
    #   COVERED  path handling throughout; the spawnRun lifecycle (exit codes,
    #            stdout/stderr capture, a failed launch); logFile append and the
    #            unopenable-log path; stop()/kill()/stopPid really terminating a
    #            process, asserted via isPidAlive, whose process.kill(pid, 0)
    #            libuv maps to an OpenProcess existence check there; and the
    #            unmocked case_run / case_stop ladder in mcpTools.test.ts, which
    #            spawns real detached children (it is also what hung this job
    #            during the reverted Ctrl+Break attempt).
    #
    #   NOT      the NAME of the signal a stop delivered — Windows has no
    #            graceful rung and TerminateProcess reports none, which is a
    #            recorded platform constraint (see doc/roadmap.md's non-goals),
    #            not a gap to close. The two detached/unref process-group tests
    #            in runProcess.test.ts stay skipped there and say so.
    #
    # spawnRun takes `platform` as an injectable parameter, so a future win32
    # unit test needs no Windows machine to write.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build tests
        run: npm run build:tests

      # `node --test out/test/` runs each of the 138 test files in its own
      # child process, in parallel, at a default concurrency of one process
      # per CPU. Several of those files load a real meshio++/MMG wasm module
      # per test case (`loadMeshio()` deliberately returns a FRESH instance
      # each time — see meshio.ts), so a file with dozens of wasm-backed
      # cases accumulates dozens of wasm instances' memory over its own
      # lifetime before that process exits and the OS reclaims it. PR #94
      # reproduced this for real on windows-latest: `meshio.test.js` (at the
      # time a single ~1100-line file covering every format PLUS the whole
      # OpenFOAM case suite) ran every subtest up to "loadMeshio instantiates
      # a coherent variant/binary pair" successfully, then V8 aborted with
      # "Fatal process OOM in Re-embedded builtins: set permissions" — a
      # Windows-specific failure to set memory permissions for a NEW
      # process's snapshot, not a bug in the test content. `meshioOpenfoam
      # .test.ts` split the OpenFOAM case suite out of `meshio.test.ts` for
      # exactly this reason: it halves how many wasm instances any ONE
      # process has to keep resident by the time it finishes (confirmed
      # locally — the full suite OOM-killed at the default per-CPU
      # concurrency on a 16-core/22 GB box, and passed clean at
      # `--test-concurrency=4`). The explicit cap here is the same mitigation
      # applied defensively to windows-latest's smaller, shared runner, since
      # further test files can grow the same way; Linux keeps the default
      # since it never reproduced this.
      #
      # 4 was NOT enough to keep master green once PRs #96/#97 grew the MCP
      # tool cases in `mcpTools.test.ts` (`case_evaluate_quantity` alone
      # spends ~11 s on windows). Run 35977526015's windows leg failed three
      # ways at that concurrency, all memory-commit exhaustion rather than
      # content: `mcpTools.test.js` aborted with a "Fatal javascript OOM in
      # MemoryChunk allocation failed during deserialization" only a few
      # subtests from its end, `oracleOps.test.js` crashed with exit 134 AFTER
      # all 78 of its subtests had already passed, and three child processes
      # could not even START ("Fatal process OOM in Re-embedded builtins: set
      # permissions") while the wasm-bearing files held their committed pages.
      # The tell is the heap sizes: the one child whose GC log made it to
      # terra reported "Committing semi space failed" at a 60 MB TOTAL heap,
      # so the OS had no pages left to give a normal Node process — the
      # budget was exhausted by concurrent wasm instances elsewhere, not by
      # anything that child had allocated. windows-latest is a 4-vCPU/16 GB
      # runner and `--test-concurrency=4` there means 4 wasm-bearing
      # processes resident at once, which is over the marginal line the
      # #94 fix left; the PR runs had passed the same content at the same
      # concurrency, so the failure is timing-flaky and any fix must buy
      # real margin, not luck. Halving the leg to 2 is that margin. Linux
      # (Ubuntu's 4-vCPU/16 GB with overcommit) keeps the default, where
      # every observably possible commit pattern passes.
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: node --test --test-concurrency=2 out/test/

      - name: Run tests
        if: runner.os != 'Windows'
        run: node --test out/test/

  # Branch protection on master requires a check named exactly `test`. A matrix
  # job reports as `test (ubuntu-latest)` / `test (windows-latest)`, so that
  # required name was never produced and every PR sat BLOCKED with all real
  # checks green. This job is the stable name: it passes only when every matrix
  # leg did. `always()` matters: without it a failed leg would SKIP this job,
  # and a skipped required check counts as passing.
  test:
    needs: test-matrix
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix leg to pass
        env:
          RESULT: ${{ needs.test-matrix.result }}
        run: |
          echo "test-matrix: $RESULT"
          [ "$RESULT" = "success" ]
