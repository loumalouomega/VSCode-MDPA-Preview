name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    # Tier 1 item 1 (graceful stop on Windows) budgets this leg before the fix:
    # the stop-ladder's win32 branches can only be proven here, and the four
    # `t.skip("...win32")` guards in runProcess.test.ts are triaged against it.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Real-process stop tests need a python (not Kratos): the win32
      # graceful-break experiment asserts a try/finally marker survives a stop.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
