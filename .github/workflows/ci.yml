name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    # windows-latest catches win32-only regressions (path handling, the
    # process-group semantics runProcess.test.ts's `t.skip("...win32")`
    # guards call out, etc.) that ubuntu-latest alone cannot.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
