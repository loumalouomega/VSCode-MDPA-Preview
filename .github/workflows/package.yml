name: Package Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - run: npm ci

      - name: Run tests
        run: npm test

      # The VTK-wasm renderer runtime ships in the .vsix (roadmap item 18):
      # fetched by commit, hash-verified file by file, glue patched and
      # re-verified, backend API audited, licences staged. vscode:prepublish's
      # production build would do this too; running it as its own step makes a
      # pin or network failure fail HERE, with its own log.
      - name: Prepare the VTK-wasm renderer runtime
        run: npm run vtkwasm:prepare

      - name: Package VSIX
        run: ./node_modules/.bin/vsce package --no-dependencies

      - name: Verify the packaged VTK-wasm runtime
        run: node scripts/vtk-wasm/verify-vsix.mjs *.vsix

      # GitHub's Releases API intermittently answers 500 on a tag push, and
      # action-gh-release's own retry is not a resilience mechanism: run
      # 36713408083 (v4.19.0) burned all three of its attempts inside six
      # seconds — 12:17:43, :47, :49 — and gave up, failing the release and,
      # because the marketplace publish below is sequenced after this step,
      # skipping that too. The same request replays cleanly by hand a few
      # minutes later, and v4.18.0 had published with the identical config, so
      # the status was GitHub's and not this repo's: a transient 5xx deserves
      # a wait, and only a wait.
      #
      # `gh` is already on the runner image, so the backoff lives here instead
      # of in another third-party action. The same fields the action took are
      # passed through: the .vsix assets, generated notes, published (not
      # draft) and --prerelease for a tag carrying a '-'. The create path is
      # guarded by a `release view` so a re-run after a PARTIAL failure
      # re-uploads with --clobber instead of dying on "release already
      # exists" — the same overwrite_files:true intent, made idempotent.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          tag="$GITHUB_REF_NAME"
          # No --verify-tag: this workflow also runs on workflow_dispatch, where
          # GITHUB_REF_NAME is a branch that has no tag, and the old action
          # created one. gh does the same, so the manual trigger still works.
          create=(gh release create "$tag" ./*.vsix --generate-notes --title "$tag")
          if [ "$PRERELEASE" = "true" ]; then create+=(--prerelease); fi

          # 5 attempts, linear 15 s backoff (150 s of waiting in total) — long
          # enough to outlast the kind of GitHub-side blip that took out
          # v4.19.0, short enough to stay a release pipeline rather than a
          # job that hangs. Only transient statuses are retried: a 4xx here
          # is a real defect (bad tag, missing permission, refused asset),
          # and repeating it verbatim would only delay the log that explains
          # it. 429 is the exception GitHub documents as retryable.
          #
          # `already_exists` is retried too, and that is not cosmetic. The
          # `release view` guard above can itself answer 5xx, in which case
          # the `elif` falls through to `create` against a release that does
          # exist and gets a 422 already_exists — which this loop would
          # otherwise treat as a permanent defect and hard-fail on, turning a
          # transient blip into the very outcome this step exists to prevent.
          # Retrying re-enters the guard, which now succeeds, and the upload
          # path finishes the job.
          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" >/dev/null 2>&1; then
              if out=$(gh release upload "$tag" ./*.vsix --clobber 2>&1); then
                echo "Re-uploaded assets to the existing $tag release."
                echo "$out"
                exit 0
              fi
            elif out=$("${create[@]}" 2>&1); then
              echo "Created the $tag release."
              echo "$out"
              exit 0
            fi
            echo "::error::release attempt $attempt/5 failed: $out"
            if printf '%s' "$out" | grep -qE 'HTTP 5[0-9][0-9]|HTTP 429|already_exists'; then
              if [ "$attempt" -lt 5 ]; then
                echo "Transient — retrying in $((attempt * 15))s."
                sleep $((attempt * 15))
              fi
            else
              echo "Not a transient status — not retrying."
              exit 1
            fi
          done
          echo "::error::gave up publishing the release for $tag after 5 attempts."
          exit 1

      - name: Publish to Visual Studio Marketplace
        if: ${{ !contains(github.ref_name, '-') }}
        run: ./node_modules/.bin/vsce publish --no-dependencies --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
